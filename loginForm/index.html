<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f8f9f8;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 400px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 25px;
}

.logo span {
    color: #45a85b;
}

.subtitle {
    color: #777;
    font-size: 15px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    height: 50px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0 15px;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
    transition: .2s;
}

input:focus {
    border-color: #45a85b;
}

button {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 10px;
    background: #45a85b;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #398f4c;
}

.login {
    text-align: center;
    margin-top: 20px;
    color: #777;
    font-size: 14px;
}

.login a {
    color: #45a85b;
    text-decoration: none;
}
</style>

</head>

<body>

<div class="card">

    <div class="logo">
        Login<span>Register</span>
    </div>

    <div class="subtitle">
        Fill in your details to login to your account
    </div>

    <input type="text" placeholder="Username">

    <input type="email" placeholder="Email address">

    <input type="password" placeholder="Password">

    <input type="password" placeholder="Confirm password">

    <button>
        Login Register 
    </button>

</div>

</body>
</html>
